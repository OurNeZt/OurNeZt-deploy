services:
  postgres:
    image: postgres:17-bookworm
    container_name: ournezt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ournezt}
      POSTGRES_USER: ${POSTGRES_USER:-ournezt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ournezt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  core:
    image: ghcr.io/ournezt/ournezt-core:${CORE_IMAGE_TAG:-v2.0.0}
    container_name: ournezt-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${CORE_APP_ENV:-development}
      GRPC_ADDR: :50051
      GRPC_TLS_CERT_FILE: ${CORE_GRPC_TLS_CERT_FILE:-}
      GRPC_TLS_KEY_FILE: ${CORE_GRPC_TLS_KEY_FILE:-}
      GRPC_ALLOW_INSECURE: ${CORE_GRPC_ALLOW_INSECURE:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-ournezt}:${POSTGRES_PASSWORD:-ournezt}@postgres:5432/${POSTGRES_DB:-ournezt}?sslmode=disable
      SESSION_TOKEN_BYTES: ${CORE_SESSION_TOKEN_BYTES:-32}
      SESSION_TTL: ${CORE_SESSION_TTL:-24h}
      AUTH_IP_LIMIT: ${CORE_AUTH_IP_LIMIT:-120}
      AUTH_ACCOUNT_LIMIT: ${CORE_AUTH_ACCOUNT_LIMIT:-5}
      AUTH_RATE_WINDOW: ${CORE_AUTH_RATE_WINDOW:-1m}
      AUTH_MAX_CONCURRENT: ${CORE_AUTH_MAX_CONCURRENT:-2}
      RUN_MIGRATIONS: ${CORE_RUN_MIGRATIONS:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${CORE_BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${CORE_BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${CORE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Admin}
    ports:
      - "${CORE_GRPC_PORT:-50051}:50051"

  web:
    image: ghcr.io/ournezt/ournezt-web:${WEB_IMAGE_TAG:-v2.0.0}
    container_name: ournezt-web
    restart: unless-stopped
    depends_on:
      core:
        condition: service_started
    environment:
      APP_ENV: ${WEB_APP_ENV:-development}
      WEB_ADDR: :8080
      CORE_GRPC_ADDR: core:50051
      CORE_GRPC_USE_TLS: ${WEB_CORE_GRPC_USE_TLS:-false}
      CORE_ALLOW_INSECURE: ${WEB_CORE_ALLOW_INSECURE:-false}
      CORE_GRPC_TLS_CA_FILE: ${WEB_CORE_GRPC_TLS_CA_FILE:-}
      CORE_GRPC_TLS_SERVER_NAME: ${WEB_CORE_GRPC_TLS_SERVER_NAME:-}
      CORE_GRPC_TLS_INSECURE_SKIP_VERIFY: ${WEB_CORE_GRPC_TLS_INSECURE_SKIP_VERIFY:-false}
      SESSION_COOKIE_NAME: ${WEB_SESSION_COOKIE_NAME:-ournezt_session}
      SESSION_COOKIE_MAX_AGE: ${WEB_SESSION_COOKIE_MAX_AGE:-24h}
      SESSION_COOKIE_SECURE: ${WEB_SESSION_COOKIE_SECURE:-false}
      CSRF_AUTH_KEY: ${WEB_CSRF_AUTH_KEY:-}
      REQUEST_TIMEOUT: ${WEB_REQUEST_TIMEOUT:-5s}
      SHUTDOWN_TIMEOUT: ${WEB_SHUTDOWN_TIMEOUT:-10s}
      WEB_READ_HEADER_TIMEOUT: ${WEB_READ_HEADER_TIMEOUT:-10s}
      WEB_READ_TIMEOUT: ${WEB_READ_TIMEOUT:-15s}
      WEB_WRITE_TIMEOUT: ${WEB_WRITE_TIMEOUT:-30s}
      WEB_IDLE_TIMEOUT: ${WEB_IDLE_TIMEOUT:-60s}
      WEB_MAX_REQUEST_BODY_BYTES: ${WEB_MAX_REQUEST_BODY_BYTES:-1048576}
      AUTH_IP_LIMIT: ${WEB_AUTH_IP_LIMIT:-30}
      AUTH_ACCOUNT_LIMIT: ${WEB_AUTH_ACCOUNT_LIMIT:-5}
      AUTH_RATE_WINDOW: ${WEB_AUTH_RATE_WINDOW:-1m}
      AUTH_MAX_CONCURRENT: ${WEB_AUTH_MAX_CONCURRENT:-8}
      WEB_TRUSTED_PROXIES: ${WEB_TRUSTED_PROXIES:-}
      MAINTENANCE_NOTICE_ENABLED: ${WEB_MAINTENANCE_NOTICE_ENABLED:-false}
      MAINTENANCE_NOTICE_LEVEL: ${WEB_MAINTENANCE_NOTICE_LEVEL:-warning}
      MAINTENANCE_NOTICE_TITLE: ${WEB_MAINTENANCE_NOTICE_TITLE:-}
      MAINTENANCE_NOTICE_MESSAGE: ${WEB_MAINTENANCE_NOTICE_MESSAGE:-}
      MAINTENANCE_NOTICE_STARTS_AT: ${WEB_MAINTENANCE_NOTICE_STARTS_AT:-}
      MAINTENANCE_NOTICE_ENDS_AT: ${WEB_MAINTENANCE_NOTICE_ENDS_AT:-}
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  postgres_data:

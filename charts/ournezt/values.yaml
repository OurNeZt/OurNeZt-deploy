# -----------------------------------------------------------------------------
# Chart naming
# -----------------------------------------------------------------------------
# Optional release name overrides. Leave empty for Helm defaults.
nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Global settings applied across services
# -----------------------------------------------------------------------------
global:
  # Runtime profile used by core/web containers (development|staging|production)
  appEnv: production

# -----------------------------------------------------------------------------
# PostgreSQL (stateful)
# -----------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: 17-bookworm
    pullPolicy: IfNotPresent
  service:
    # Use ClusterIP for in-cluster access. Expose externally via a dedicated DB
    # access pattern only if absolutely required.
    type: ClusterIP
    port: 5432
  auth:
    # In production, prefer existingSecret over inline password.
    database: ournezt
    username: ournezt
    password: ournezt-change-me
    # If set, chart will read DB password from this secret instead of .auth.password.
    existingSecret: ""
    # Key name inside the referenced secret.
    passwordKey: POSTGRES_PASSWORD
  persistence:
    enabled: true
    # Set explicitly in production clusters to match your storage class policy.
    storageClassName: ""
    size: 20Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

# -----------------------------------------------------------------------------
# OurNeZt Core (gRPC API)
# -----------------------------------------------------------------------------
core:
  enabled: true
  # Increase for higher availability after validating DB capacity and migrations.
  replicaCount: 1
  image:
    repository: ghcr.io/ournezt/ournezt-core
    tag: v2.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 50051
  grpcAddr: ":50051"
  # Production requires TLS or this explicit opt-in for a trusted plaintext hop.
  allowInsecure: false
  tls:
    # Enables TLS for core gRPC listener (internal pod-to-pod encryption).
    enabled: false
    # Secret containing certificate and key for core gRPC server.
    # Expected keys are tls.crt and tls.key by default.
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    # Mount settings for certificate files.
    mountPath: /etc/ournezt/core-tls
    certFileName: tls.crt
    keyFileName: tls.key
  # Optional full override.
  # Leave empty to auto-build DATABASE_URL from postgres.* values above.
  # Set this when using an external/managed PostgreSQL instance.
  databaseURL: ""
  sessionTokenBytes: 32
  sessionTTL: 24h
  # Per-process limits; Core sees Web as the transport peer.
  authLimits:
    ipLimit: 120
    accountLimit: 5
    rateWindow: 1m
    maxConcurrent: 2
  # Core container entrypoint migration switch.
  # Keep true for simple environments; disable if you run migrations separately.
  runMigrations: "true"
  bootstrap:
    # One-time admin bootstrap. Keep disabled after initial setup.
    enabled: false
    adminEmail: ""
    adminDisplayName: "Bootstrap Admin"
    # 15+ characters, at most 1024 UTF-8 bytes, no whitespace/common passwords.
    adminPassword: ""
    # If set, bootstrap password is read from this secret.
    existingSecret: ""
    passwordKey: BOOTSTRAP_ADMIN_PASSWORD
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# -----------------------------------------------------------------------------
# OurNeZt Web (HTTP)
# -----------------------------------------------------------------------------
web:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/ournezt/ournezt-web
    tag: v2.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  webAddr: ":8080"
  requestTimeout: 5s
  shutdownTimeout: 10s
  httpLimits:
    readHeaderTimeout: 10s
    readTimeout: 15s
    writeTimeout: 30s
    idleTimeout: 60s
    maxRequestBodyBytes: 1048576
  csrf:
    # Production requires a persistent 32-byte secret encoded as 64 hex characters.
    # Prefer an existing Secret. Never generate a new key on every Helm upgrade.
    existingSecret: ""
    key: CSRF_AUTH_KEY
    # Alternative: chart-managed Secret; do not commit real keys to source control.
    authKey: ""
  # Empty uses the chart's Core Service. Override for an external Core/TLS proxy.
  coreGrpcAddr: ""
  # Production plaintext requires an explicit opt-in in both Core and Web.
  coreAllowInsecure: false
  # Per-process limits for browser authentication submissions.
  authLimits:
    ipLimit: 30
    accountLimit: 5
    rateWindow: 1m
    maxConcurrent: 8
  # Only list the actual ingress/reverse proxy IPs or CIDRs.
  trustedProxies: []
  coreGrpcTLS:
    # Enables TLS for web -> core gRPC connection.
    enabled: false
    # Optional CA bundle secret for verifying core certificate.
    # If empty, system trust store is used.
    caSecret: ""
    caKey: ca.crt
    caMountPath: /etc/ournezt/core-ca
    caFileName: ca.crt
    # Optional override for TLS server name verification.
    serverName: ""
    # Development only; the chart rejects true in production.
    insecureSkipVerify: "false"
  sessionCookieName: ournezt_session
  sessionCookieMaxAge: 24h
  # Keep true in production; browser-facing HTTPS can terminate at ingress.
  sessionCookieSecure: "true"
  maintenanceNotice:
    # Mounted as a ConfigMap-backed JSON file and read by the web app on each page render.
    # Edit the ConfigMap to update copy without rebuilding the image.
    enabled: false
    level: warning
    title: ""
    message: ""
    startsAt: ""
    endsAt: ""
    mountPath: /etc/ournezt/maintenance-notice
    fileName: notice.json
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    # Enable and configure for public HTTP/S access.
    enabled: false
    # Example: nginx, traefik, alb
    className: ""
    annotations: {}
    hosts:
      - host: ournezt.local
        paths:
          - path: /
            pathType: Prefix
    # Example:
    # tls:
    #   - secretName: ournezt-web-tls
    #     hosts:
    #       - app.example.com
    tls: []

# -----------------------------------------------------------------------------
# Pod/container security defaults
# -----------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 999

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true

# -----------------------------------------------------------------------------
# Optional scheduling constraints
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ournezt-postgres.fullname" . }}
  labels:
    {{- include "ournezt-postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.passwordKey }}: {{ .Values.postgres.password | quote }}
{{- end }}

name: ci

on:
  pull_request:
    branches: [dev, stable]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example -f docker-compose.yml config > /dev/null

      - name: Validate local build override
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.build.yml config > /dev/null

      - name: Validate verified TLS override
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.tls.yml config > /dev/null

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm lint
        run: |
          helm lint ./charts/ournezt -f examples/values-production.yaml
          helm lint ./charts/ournezt -f examples/values-development.yaml

      - name: Helm template render
        run: helm template ournezt ./charts/ournezt -f examples/values-production.yaml > /dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Verify rendered deployment behavior
        run: python -m unittest discover -s tests -v
